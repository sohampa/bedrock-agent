# AgentCore CI/CD — validate, deploy, PR review (single account, us-east-1)
#
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, GITHUB_TOKEN
# Environments: dev (auto deploy), staging, production (manual promote)

name: AgentCore CI/CD

concurrency:
  group: agentcore-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: Promote to staging or prod
        required: true
        type: choice
        options:
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  AGENTCORE_REGION: us-east-1
  UV_LINK_MODE: copy

permissions:
  contents: read

jobs:
  validate:
    name: Lint • Test • Validate • Policy
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install agent dependencies
        working-directory: app/MyAgent
        run: |
          uv sync
          uv pip install pytest ruff bandit

      - name: Ruff lint
        working-directory: app/MyAgent
        run: uv run ruff check .

      - name: Generate Bandit reports
        working-directory: app/MyAgent
        run: |
          uv run bandit -r . -x ./.venv -f sarif -o bandit.sarif || true
          uv run bandit -r . -x ./.venv -f json -o bandit.json || true

      - name: Ensure Bandit report files exist
        working-directory: app/MyAgent
        run: |
          test -f bandit.json || echo '{"errors":[],"generated_at":"","metrics":{},"results":[]}' > bandit.json
          if [ ! -f bandit.sarif ]; then
            cat > bandit.sarif << 'EOF'
          {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": []
          }
          EOF
          fi

      - name: Bandit security scan (enforced gate)
        working-directory: app/MyAgent
        run: uv run bandit -r . -x ./.venv -ll

      - name: Upload Bandit SARIF to GitHub Code Scanning
        if: always() && hashFiles('app/MyAgent/bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/MyAgent/bandit.sarif

      - name: Upload Bandit report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: |
            app/MyAgent/bandit.sarif
            app/MyAgent/bandit.json
          if-no-files-found: warn


      - name: Pytest
        working-directory: app/MyAgent
        run: uv run pytest tests/ -q

      - name: Scope policy gate
        run: python scripts/test_scope.py

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=almcybage
            -Dsonar.projectKey=almcybage_bedrock-agent
            -Dsonar.sources=app/MyAgent
            -Dsonar.python.version=3.12

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install AgentCore CLI
        run: npm install -g @aws/agentcore

      - name: Validate AgentCore config
        run: agentcore validate

      - name: CI summary
        if: success()
        run: |
          echo "CI passed: lint, bandit, pytest, scope policy, agentcore validate"
          echo "Region: us-east-1 | Targets: dev, staging, prod (same account)"

  deploy-dev:
    name: Deploy to dev (us-east-1)
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm install -g @aws/agentcore

      - name: Install CDK dependencies
        working-directory: agentcore/cdk
        run: npm ci

      - name: Deploy AgentCore to dev
        env:
          UV_LINK_MODE: copy
        run: agentcore deploy --target dev

      - name: Deployment status
        run: agentcore status --target dev

  promote:
    name: Deploy to ${{ inputs.target }} (us-east-1)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target == 'prod' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm install -g @aws/agentcore

      - name: Install CDK dependencies
        working-directory: agentcore/cdk
        run: npm ci

      - name: Validate config
        run: agentcore validate

      - name: Deploy AgentCore
        env:
          UV_LINK_MODE: copy
        run: agentcore deploy --target ${{ inputs.target }}

      - name: Deployment status
        run: agentcore status --target ${{ inputs.target }}
